<!doctype html>
<meta charset="utf-8">
<title>Alpine Linux in v86 (boot timer)</title>
<style>
    body { font: 14px sans-serif; margin: 16px; background: #222; color: #ddd; }
    #screen_container { display: inline-block; background: #000; vertical-align: top; }
    #screen_container canvas { image-rendering: pixelated; }
    #side { display: inline-block; vertical-align: top; margin-left: 16px; }
    button { margin-right: 8px; }
    #status { font: 12px monospace; margin-top: 8px; }
    #log { font: 12px monospace; white-space: pre; background: #111; padding: 8px; min-width: 38em; min-height: 14em; }
    a { color: #8cf; }
</style>

<p id="title"></p>
<p>
    <button id="login">type "root"</button>
    <button id="bench">type shell-loop benchmark</button>
    <button id="gui">GUI: on (click to disable)</button>
    <button id="copy">copy timing log</button>
    <label><input type="checkbox" id="autoenter" checked> press Enter at the boot: prompt</label>
    <label><input type="checkbox" id="autologin" checked> log in as root automatically</label>
</p>
<div id="screen_container">
    <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
    <canvas style="display: none"></canvas>
</div>
<div id="side">
    <div id="log"></div>
    <div id="status"></div>
</div>

<script src="../build/libv86.js"></script>
<script>
"use strict";

const arch = new URLSearchParams(location.search).get("arch") === "x86" ? "x86" : "x86_64";
const iso = arch === "x86" ? "alpine-x86.iso" : "alpine.iso";
document.getElementById("title").innerHTML = "Alpine Linux " + (arch === "x86" ? "3.21.9" : "3.24.3") + " <b>" + (arch === "x86" ? "32-bit (x86)" : "64-bit (x86_64)") +
    "</b> in v86 &nbsp; <a href='?'>64-bit</a> | <a href='?arch=x86'>32-bit</a> &nbsp; (timer starts when the page loads)";

const t0 = performance.now();
const emulator = window.emulator = new V86({
    wasm_path: "../build/v86.wasm",
    memory_size: 512 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    screen_container: document.getElementById("screen_container"),
    bios: { url: "../bios/seabios.bin" },
    vga_bios: { url: "../bios/vgabios.bin" },
    cdrom: { url: iso },
    autostart: true,
});

// instructions retired so far (the guest counter is 32 bits and wraps: accumulate the deltas)
let total = 0, last_counter = 0;
function instructions()
{
    if(!emulator.v86) return total;     // the emulator object appears once the wasm has loaded
    const c = emulator.v86.cpu.instruction_counter[0] >>> 0;
    total += (c - last_counter) >>> 0;
    last_counter = c;
    return total;
}

// the guest also logs to the serial console (kernel option console=ttyS0): unlike the screen it stays
// readable text after the graphics driver has switched the display to a framebuffer
let serial = "";
emulator.add_listener("serial0-output-byte", b => { serial += String.fromCharCode(b); if(serial.length > 20000) serial = serial.slice(-10000); });

const lines = [];
function log(text)
{
    const s = (performance.now() - t0) / 1000;
    const n = instructions();
    lines.push(s.toFixed(1).padStart(7) + " s  " + text + "   [" + (n / 1e6).toFixed(0) + " M instr, avg " + (n / 1e6 / s).toFixed(1) + " MIPS]");
    document.getElementById("log").textContent = lines.join("\n");
}
log("page loaded, " + arch + " ISO requested");

document.getElementById("login").onclick = () => emulator.keyboard_send_text("root\n");
// 40000 iterations of i=$((i+1)) in busybox ash
document.getElementById("bench").onclick = () => {
    log("benchmark started (serial shell): 40000-iteration shell loop");
    emulator.serial0_send("time sh -c 'i=0; while [ $i -lt 40000 ]; do i=$((i+1)); done'\n");
};
document.getElementById("copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(arch + "\n" + lines.join("\n"));

let gui_on = true;
document.getElementById("gui").onclick = () => {
    gui_on = !gui_on;
    document.getElementById("gui").textContent = gui_on ? "GUI: on (click to disable)" : "GUI: off (click to enable)";
    document.getElementById("screen_container").style.opacity = gui_on ? 1 : 0.15;
    if(gui_on) emulator.screen_adapter.continue(); else emulator.screen_adapter.pause();
};

// timeline: watch the text screen for the boot prompt, the login prompt and the benchmark result
const seen = {};
let bench_results = 0;
setInterval(() => {
    let text = "";
    // read the VGA text buffer (80x25 at 0xB8000) from guest memory: unlike the screen adapter it does not
    // depend on the tab being visible and drawing
    try {
        const mem = emulator.read_memory(0xB8000, 4000);
        const rows = [];
        for(let r = 0; r < 25; r++) { let row = ""; for(let c = 0; c < 80; c++) row += String.fromCharCode(mem[(r * 80 + c) * 2] || 32); rows.push(row); }
        text = rows.join("\n");
    } catch(e) {}
    if(!text.trim()) { try { text = emulator.screen_adapter.get_text_screen().join("\n"); } catch(e) {} }
    if(!seen.first && text.trim()) { seen.first = true; log("first text on screen (BIOS)"); }
    if(!seen.prompt && /boot:/.test(text)) {
        seen.prompt = true;
        log("boot: prompt");
        if(document.getElementById("autoenter").checked) {
            // the boot prompt drops keys that arrive too fast: one character every 120 ms
            const opts = "virt console=tty0 console=ttyS0,115200\n";
            [...opts].forEach((ch, i) => setTimeout(() => emulator.keyboard_send_text(ch), i * 120));
            log("typed boot options (console=tty0 console=ttyS0): serial log on");
        }
    }
    if(!seen.kernel && /Linux version|OpenRC .* is starting up/.test(serial)) { seen.kernel = true; log("kernel is up"); }
    if(!seen.init && /OpenRC .* is starting up/.test(serial)) { seen.init = true; log("init scripts running (OpenRC)"); }
    if(!seen.login && /localhost login:/.test(serial)) {
        seen.login = true;
        log("LOGIN PROMPT REACHED  (boot time)");
        if(document.getElementById("autologin").checked) {
            emulator.serial0_send("root\n");            // the serial console, whose output the timeline reads
            emulator.keyboard_send_text("root\n");      // and the screen console, for you
            log("typed root");
        }
    }
    if(!seen.shell && /Welcome to Alpine!/.test(serial)) { seen.shell = true; log("logged in (shell)"); }
    const results = serial.match(/real\s+\S+/g) || [];
    if(results.length > bench_results) {
        bench_results = results.length;
        log("benchmark result: " + results[results.length - 1].replace(/\s+/g, " "));
    }
}, 300);

let last = 0, last_t = performance.now();
setInterval(() => {
    if(!emulator.v86) return;
    const cpu = emulator.v86.cpu;
    const mem = new Uint8Array(cpu.wasm_memory.buffer);
    const n = instructions(), t = performance.now();
    const mips = (n - last) / ((t - last_t) * 1000);
    last = n; last_t = t;
    document.getElementById("status").textContent =
        "eip=" + (cpu.instruction_pointer[0] >>> 0).toString(16) + " is_64=" + mem[1444] + "  now " + mips.toFixed(1) + " MIPS";
}, 1000);
</script>
