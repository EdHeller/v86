[package]
name = "v86"
version = "0.1.0"
publish = false
edition = "2021"

[features]
default = []
profiler = []
parallel = []
# The parallel build for hosts with a weaker memory order than x86's (arm64): every aligned guest RAM access of the
# interpreter and the generated code is a sequentially consistent atomic, an unaligned one is followed by a fence
seqcst = ["parallel"]

[lib]
crate-type = ["cdylib"]
path = "src/rust/lib.rs"

[profile.test]
lto = false
opt-level = 2
overflow-checks = false

[profile.dev]
lto = true
opt-level = 2
panic = "abort"
overflow-checks = false

[profile.release]
lto = true
opt-level = 3
incremental = false
panic = "abort"
